[package]
name = "lexify-obfuscator"
version = "0.1.0"
edition = "2021"
description = "Conservative AST-validated Lua source obfuscator"

[[bin]]
name = "lexify-obfuscator"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
full_moon = { version = "2.1.1", features = ["lua52", "lua53", "lua54", "luau"] }
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.dev]
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true
