[package]
name = "lexify-obfuscator"
version = "0.1.0"
edition = "2021"
description = "Conservative AST-validated Lua source obfuscator"

[[bin]]
name = "lexify-obfuscator"
path = "src/main.rs"
required-features = ["cli"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
full_moon = { version = "2.1.1", features = ["lua52", "lua53", "lua54", "luau"] }
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_chacha = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.dev]
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# rustc emits bulk-memory instructions (memory.copy / memory.fill) for wasm32
# without advertising them in the target_features section, so wasm-opt rejects
# the module unless the features are enabled explicitly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-bulk-memory-opt"]
